name: Vault backup

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions: {}
concurrency:
  group: pastepost-vault-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vault-backup
    env:
      PGDATABASE: ${{ secrets.BACKUP_DATABASE_URL }}
      VAULT_BACKUP_PASSPHRASE: ${{ secrets.VAULT_BACKUP_PASSPHRASE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      VAULT_BACKUP_BUCKET: ${{ vars.VAULT_BACKUP_BUCKET }}
    steps:
      - name: Encrypt a Postgres dump and store it outside Neon
        shell: bash
        run: |
          set -euo pipefail
          : "${PGDATABASE:?Set the backup database URL}"
          : "${VAULT_BACKUP_PASSPHRASE:?Set the backup encryption passphrase}"
          : "${VAULT_BACKUP_BUCKET:?Set the private S3 bucket name}"
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          key="pastepost/$(date -u +%Y-%m-%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dump.gpg"
          docker run --rm -e PGDATABASE postgres:18 sh -c 'exec pg_dump --dbname="$PGDATABASE" --format=custom --no-owner --no-acl' > "$workdir/vault.dump"
          test -s "$workdir/vault.dump"
          printf '%s\n' "$VAULT_BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$workdir/vault.dump.gpg" "$workdir/vault.dump"
          aws s3 cp "$workdir/vault.dump.gpg" "s3://$VAULT_BACKUP_BUCKET/$key" --only-show-errors
