name: Vault backup

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      verify_restore:
        description: Restore the uploaded backup into a disposable Postgres database
        type: boolean
        default: true

permissions: {}
concurrency:
  group: pastepost-vault-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: vault-backup
    env:
      PGDATABASE: ${{ secrets.BACKUP_DATABASE_URL }}
      VAULT_BACKUP_PASSPHRASE: ${{ secrets.VAULT_BACKUP_PASSPHRASE }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.VAULT_BACKUP_BLOB_TOKEN }}
      VERIFY_RESTORE: ${{ inputs.verify_restore }}
    steps:
      - name: Encrypt a Postgres dump and store it outside Neon
        shell: bash
        run: |
          set -euo pipefail
          : "${PGDATABASE:?Set the backup database URL}"
          : "${VAULT_BACKUP_PASSPHRASE:?Set the backup encryption passphrase}"
          : "${BLOB_READ_WRITE_TOKEN:?Set the token for the dedicated private backup store}"
          workdir="$(mktemp -d)"
          restore_container=""
          cleanup() {
            if [ -n "$restore_container" ]; then docker stop "$restore_container" >/dev/null || true; fi
            rm -rf "$workdir"
          }
          trap cleanup EXIT
          # One slot per UTC day. A successful upload replaces the slot from 30
          # days earlier and object storage never needs to list or purge files.
          day=$(( $(date -u +%s) / 86400 ))
          printf -v key 'pastepost/slot-%02d.dump.gpg' "$((day % 30))"
          docker run --rm -e PGDATABASE postgres:18 sh -c 'exec pg_dump --dbname="$PGDATABASE" --format=custom --no-owner --no-acl' > "$workdir/vault.dump"
          test -s "$workdir/vault.dump"
          printf '%s\n' "$VAULT_BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$workdir/vault.dump.gpg" "$workdir/vault.dump"
          node --input-type=module - "$workdir/vault.dump.gpg" "$key" "$workdir/download.gpg" <<'JS'
          import { createReadStream, createWriteStream, statSync } from "node:fs";
          import { Readable } from "node:stream";
          import { pipeline } from "node:stream/promises";

          const [encrypted, pathname, download] = process.argv.slice(2);
          const token = process.env.BLOB_READ_WRITE_TOKEN;
          const storeId = token.split("_")[3];
          if (!storeId || !/^pastepost\/slot-\d{2}\.dump\.gpg$/.test(pathname)) {
            throw new Error("Invalid backup store or destination");
          }
          const authorization = `Bearer ${token}`;
          const length = String(statSync(encrypted).size);
          const upload = await fetch("https://vercel.com/api/blob/?" + new URLSearchParams({ pathname }), {
            method: "PUT",
            headers: {
              authorization, "x-api-version": "13", "x-vercel-blob-store-id": storeId,
              "x-vercel-blob-access": "private", "x-allow-overwrite": "1",
              "x-content-type": "application/octet-stream", "content-length": length,
              "x-content-length": length, "x-cache-control-max-age": "60",
            },
            body: createReadStream(encrypted), duplex: "half", redirect: "error",
          });
          if (!upload.ok) throw new Error(`Private backup upload returned ${upload.status}`);
          const blob = new URL((await upload.json()).url);
          if (blob.protocol !== "https:" || blob.hostname !== `${storeId.toLowerCase()}.private.blob.vercel-storage.com` ||
              blob.pathname !== `/${pathname}` || blob.search) {
            throw new Error("Unexpected private backup URL");
          }
          if (process.env.VERIFY_RESTORE === "true") {
            const result = await fetch(blob, { headers: { authorization }, cache: "no-store", redirect: "error" });
            if (!result.ok || !result.body) throw new Error(`Private backup download returned ${result.status}`);
            await pipeline(Readable.fromWeb(result.body), createWriteStream(download, { mode: 0o600 }));
          }
          JS
          printf 'Backed up UTC day %s to %s\n' "$(date -u +%F)" "$key"

          if [ "${VERIFY_RESTORE:-false}" = true ]; then
            printf '%s\n' "$VAULT_BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback --passphrase-fd 0 \
              --output "$workdir/restored.dump" --decrypt "$workdir/download.gpg"
            cmp "$workdir/vault.dump" "$workdir/restored.dump"
            restore_container="$(docker run --rm -d -e POSTGRES_PASSWORD="$(openssl rand -hex 32)" postgres:18)"
            for attempt in {1..30}; do
              if docker exec "$restore_container" pg_isready -h 127.0.0.1 -U postgres >/dev/null; then break; fi
              sleep 1
            done
            docker exec -i "$restore_container" pg_restore -U postgres -d postgres \
              --no-owner --no-acl --exit-on-error < "$workdir/restored.dump"
            migrations="$(docker exec "$restore_container" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres \
              -c "select count(*) from _migrations where name in ('0001_auth.sql', '0002_vault.sql')" )"
            test "$migrations" = 2
            docker exec "$restore_container" psql -X -qAt -v ON_ERROR_STOP=1 -U postgres \
              -c 'select count(*) from vault_items, "user" where vault_items.user_id = "user".id'
            printf '%s\n' 'Verified encrypted download and restore into isolated Postgres.'
          fi
